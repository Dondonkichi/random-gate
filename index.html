
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f7f5">
  <title>STARMYU RANDOM GATE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f8f7f5;
      color: #343434;
      font-family: "Helvetica Neue", sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 35px 24px;
      text-align: center;
    }

    .small {
      font-size: 10px;
      letter-spacing: 4px;
      color: #aaa49f;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 3px;
      line-height: 1.6;
    }

    .line {
      width: 35px;
      height: 1px;
      background: #c5a9b5;
      margin: 25px auto;
    }

    .description {
      font-size: 12px;
      line-height: 2;
      color: #88817e;
    }

    .loading {
      margin-top: 35px;
      font-size: 11px;
      letter-spacing: 2px;
      color: #b49ba6;
    }

    .footer {
      margin-top: 60px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #c0bbb7;
    }

    .dot {
      animation: blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: .2; }
      to { opacity: 1; }
    }
  </style>
</head>
